<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>MONEY BASE v1.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9eef8;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:20px 18px 10px;max-width:920px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:850;letter-spacing:.7px;font-size:20px}.sub{font-size:12px;color:#98a6bf}.wrap{max-width:920px;margin:auto;padding:8px 14px 105px}.panel{background:#172239;border:1px solid #293853;border-radius:18px;padding:17px;margin-bottom:12px}.hero{background:linear-gradient(125deg,#203b54,#172239)}.muted{color:#a4b2ca;font-size:13px}.big{font-size:30px;font-weight:800;margin:9px 0}.green{color:#53dfb2}.red{color:#ff8798}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{padding:14px}.mini strong{display:block;font-size:18px;margin-top:7px;overflow-wrap:anywhere}h2{font-size:18px;margin:8px 0 14px}h3{font-size:15px;margin:0 0 10px}.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{background:#38cba6;border:0;color:#081b1a;border-radius:11px;padding:11px 15px;font-weight:750}.secondary{background:#283953;color:#e8f0fb}.danger{background:#4a2b3b;color:#ffb7c0}.small{padding:7px 10px;font-size:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13px;color:#b9c8dd}input,select{width:100%;padding:11px;background:#0e1729;color:white;border:1px solid #40516b;border-radius:10px;min-width:0}input[type=checkbox]{width:auto}.actions{display:flex;flex-wrap:wrap;gap:7px}.rowitem{border-bottom:1px solid #2b3952;padding:12px 0}.rowitem:last-child{border:0}.progress{height:9px;border-radius:12px;background:#34445e;overflow:hidden;margin:9px 0}.progress span{display:block;background:#42d6ae;height:100%}.nav{position:fixed;bottom:0;left:0;right:0;background:#101a2d;border-top:1px solid #34435b;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{width:min(19%,140px);background:transparent;border:0;color:#a9b7cc;padding:7px 2px;font-size:11px}.nav button.active{color:#55e3bd;font-weight:800}.nav b{display:block;font-size:20px;margin-bottom:4px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#000b;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:#19263d;border:1px solid #4c617b;border-radius:18px;padding:18px;width:min(100%,480px);max-height:85vh;overflow:auto}.notice{font-size:12px;color:#b1c0d3;line-height:1.7}.pill{font-size:11px;border-radius:20px;background:#263c4b;color:#66d7b5;padding:4px 9px}.bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:#33425b;margin:10px 0}.bar span{background:#42d6ae}.bar i{background:#7297ee}.chart{display:flex;align-items:end;gap:8px;height:140px;padding:10px 0}.chart div{flex:1;min-width:0;text-align:center;font-size:10px;color:#a6b4cb}.chart em{display:block;background:#49c9ac;border-radius:5px 5px 0 0;min-height:3px}.empty{padding:18px 0;color:#98a8bf;text-align:center;font-size:13px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big{font-size:38px}}
</style></head><body><header><div><div class="logo">💰 MONEY BASE <span class="pill">v1.0</span></div><div class="sub">個人のお金と目標を、ひとつに。</div></div><button class="btn secondary small" onclick="openSettings()">⚙ 設定</button></header><main class="wrap" id="app"></main><nav class="nav" id="nav"></nav><div id="modalroot"></div><script>
const KEY='moneybase-v1';const today=()=>new Date().toLocaleDateString('sv-SE');const month=()=>today().slice(0,7);const money=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2,10);const init=()=>({accounts:[],cards:[],transactions:[],goals:[],investments:[],debts:[],budgets:{},settings:{reserve:0,monthlySaving:0},version:1});let db;try{db={...init(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=init()}let tab='home';let selectedMonth=month();const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const acct=id=>db.accounts.find(x=>x.id===id);const card=id=>db.cards.find(x=>x.id===id);const balance=a=>Number(a.opening||0)+db.transactions.reduce((sum,t)=>sum+(t.accountId===a.id?(t.kind==='income'?+t.amount:t.kind==='expense'?-t.amount:t.kind==='transferOut'?-t.amount:t.kind==='transferIn'?+t.amount:t.kind==='cardPayment'?-t.amount:0):0),0);const cardDue=c=>db.transactions.filter(t=>t.kind==='cardExpense'&&t.cardId===c.id&&!t.paid).reduce((s,t)=>s+Number(t.amount),0);const held=a=>db.goals.filter(g=>g.accountId===a.id).reduce((s,g)=>s+Number(g.saved||0),0);const reservedCard=a=>db.cards.filter(c=>c.accountId===a.id).reduce((s,c)=>s+cardDue(c),0);const fmtDate=d=>d?d.replaceAll('-','/'):'';const num=v=>Math.max(0,Number(v)||0);const mtx=()=>db.transactions.filter(t=>t.date?.slice(0,7)===selectedMonth);const sumKind=(items,k)=>items.filter(x=>x.kind===k).reduce((s,x)=>s+Number(x.amount),0);const net=()=>db.accounts.reduce((s,a)=>s+balance(a),0)+db.investments.reduce((s,x)=>s+num(x.value),0)-db.debts.reduce((s,x)=>s+num(x.balance),0)-db.cards.reduce((s,c)=>s+cardDue(c),0);const options=(list,sel)=>list.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');const accountOptions=()=>options(db.accounts);const cardOptions=()=>options(db.cards);const field=(label,name,type='text',value='',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;const select=(label,name,items)=>`<label class="field">${label}<select name="${name}">${items}</select></label>`;const empty=t=>`<div class="empty">${t}</div>`;const btn=(label,fn,cls='secondary small')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;
function render(){document.getElementById('nav').innerHTML=[['home','⌂','ホーム'],['cash','⇄','収支'],['assets','▣','資産'],['goals','◎','目標'],['analysis','▥','分析']].map(([key,ic,label])=>`<button class="${tab===key?'active':''}" onclick="tab='${key}';render()"><b>${ic}</b>${label}</button>`).join('');document.getElementById('app').innerHTML=({home:homeView,cash:cashView,assets:assetsView,goals:goalsView,analysis:analysisView}[tab])()}
function homeView(){const tx=mtx(),income=sumKind(tx,'income'),expense=sumKind(tx,'expense')+sumKind(tx,'cardExpense');const cash=db.accounts.reduce((s,a)=>s+balance(a),0),invest=db.investments.reduce((s,x)=>s+num(x.value),0),liab=db.debts.reduce((s,x)=>s+num(x.balance),0)+db.cards.reduce((s,c)=>s+cardDue(c),0);const free=db.accounts.reduce((s,a)=>s+balance(a)-held(a)-reservedCard(a),0)-num(db.settings.reserve);return `<section class="panel hero"><div class="muted">現在の純資産</div><div class="big">${money(net())}</div><div class="muted">預金・投資 − ローン・カード未払い</div></section><div class="grid"><div class="panel mini"><div class="muted">💵 現金・預金</div><strong>${money(cash)}</strong></div><div class="panel mini"><div class="muted">📈 投資評価額</div><strong>${money(invest)}</strong></div><div class="panel mini"><div class="muted">💳 負債・未払い</div><strong>${money(liab)}</strong></div><div class="panel mini"><div class="muted">🟢 自由資金の目安</div><strong class="${free<0?'red':'green'}">${money(free)}</strong></div></div><section class="panel"><div class="flex"><h2>今月の収支</h2><span class="muted">${selectedMonth}</span></div><div class="flex rowitem"><span>収入</span><strong class="green">${money(income)}</strong></div><div class="flex rowitem"><span>支出</span><strong>${money(expense)}</strong></div><div class="flex rowitem"><b>収支差額</b><b class="${income-expense>=0?'green':'red'}">${money(income-expense)}</b></div><div class="actions" style="margin-top:12px">${btn('＋ 収支を登録','transactionForm()','')}${btn('口座を追加','accountForm()')}</div></section><section class="panel"><div class="flex"><h2>欲しいもの貯金</h2>${btn('＋ 追加','goalForm()')}</div>${db.goals.length?db.goals.slice(0,3).map(goalRow).join(''):empty('目標を登録すると達成予測が表示されます')}</section><p class="notice">自由資金は口座残高から目的別確保額・カード未払い・生活防衛資金を差し引いた概算です。今後の生活費や未記録の支払いは含まれません。</p>`}
function cashView(){const tx=mtx(),income=sumKind(tx,'income'),expense=sumKind(tx,'expense')+sumKind(tx,'cardExpense');return `<section class="panel"><div class="flex"><h2>収支管理</h2>${btn('＋ 取引登録','transactionForm()','')}</div><label class="field">表示月<input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label><div class="grid"><div class="panel mini"><div class="muted">収入</div><strong class="green">${money(income)}</strong></div><div class="panel mini"><div class="muted">支出</div><strong>${money(expense)}</strong></div></div><h3>取引履歴</h3>${tx.length?tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="rowitem flex"><div><strong>${esc(t.title)}</strong><div class="muted">${fmtDate(t.date)} · ${esc(({income:'収入',expense:'支出',cardExpense:'クレカ利用',cardPayment:'カード支払',transferOut:'振替出金',transferIn:'振替入金'}[t.kind]||t.kind))} · ${esc(t.category||'')}</div></div><div style="text-align:right"><strong class="${t.kind==='income'?'green':''}">${t.kind==='income'?'+':'−'}${money(t.amount)}</strong><div>${btn('削除',`removeItem('transactions','${t.id}')`,'danger small')}</div></div></div>`).join(''):empty('この月の取引はまだありません')}</section><section class="panel"><h2>カテゴリ別予算</h2><div class="actions">${btn('予算設定','budgetForm()')}</div>${Object.entries(db.budgets).map(([k,v])=>{const spent=tx.filter(t=>['expense','cardExpense'].includes(t.kind)&&t.category===k).reduce((s,t)=>s+num(t.amount),0);return `<div class="rowitem"><div class="flex"><b>${esc(k)}</b><span>${money(spent)} / ${money(v)}</span></div><div class="progress"><span style="width:${Math.min(100,v?spent/v*100:0)}%;background:${spent>v?'#ff8798':''}"></span></div></div>`}).join('')||empty('予算を登録できます')}</section>`}
function assetsView(){return `<section class="panel"><div class="flex"><h2>銀行口座・現金</h2>${btn('＋ 口座','accountForm()','')}</div>${db.accounts.length?db.accounts.map(a=>`<div class="rowitem"><div class="flex"><div><strong>${esc(a.name)}</strong><div class="muted">目標用 ${money(held(a))} · カード未払 ${money(reservedCard(a))}</div></div><strong>${money(balance(a))}</strong></div><div class="actions" style="margin-top:8px">${btn('編集',`accountForm('${a.id}')`)}${btn('削除',`removeItem('accounts','${a.id}')`,'danger small')}</div></div>`).join(''):empty('まずは口座を登録してください')}</section><section class="panel"><div class="flex"><h2>クレジットカード</h2>${btn('＋ カード','cardForm()','')}</div>${db.cards.length?db.cards.map(c=>`<div class="rowitem"><div class="flex"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(acct(c.accountId)?.name||'引き落とし口座未設定')} · ${esc(c.closing)}日締め / ${esc(c.payment)}日支払</div></div><strong>${money(cardDue(c))}</strong></div><div class="actions" style="margin-top:8px">${btn('編集',`cardForm('${c.id}')`)}${btn('未払いを精算',`payCard('${c.id}')`)}${btn('削除',`removeItem('cards','${c.id}')`,'danger small')}</div></div>`).join(''):empty('カードを登録すると引き落とし口座を指定できます')}<p class="notice">カード利用は支出として記録。精算時は引き落とし口座残高だけ減らし、支出は二重計上しません。締め日・支払日は管理用設定で、引き落としは手動確定です。</p></section><div class="two"><section class="panel"><div class="flex"><h2>投資資産</h2>${btn('＋ 投資','investmentForm()','')}</div>${db.investments.map(x=>`<div class="rowitem flex"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.type)} · 元本 ${money(x.cost)}</div></div><div style="text-align:right"><b>${money(x.value)}</b><div>${btn('編集',`investmentForm('${x.id}')`)} ${btn('削除',`removeItem('investments','${x.id}')`,'danger small')}</div></div></div>`).join('')||empty('NISA・株・投信などを登録')}</section><section class="panel"><div class="flex"><h2>ローン・負債</h2>${btn('＋ 負債','debtForm()','')}</div>${db.debts.map(x=>`<div class="rowitem flex"><b>${esc(x.name)}</b><div style="text-align:right"><b>${money(x.balance)}</b><div>${btn('編集',`debtForm('${x.id}')`)} ${btn('削除',`removeItem('debts','${x.id}')`,'danger small')}</div></div></div>`).join('')||empty('借入残高を登録')}</section></div>`}
function goalRow(g){const rem=Math.max(0,num(g.price)-num(g.saved)),pct=num(g.price)?Math.min(100,num(g.saved)/num(g.price)*100):100;const months=rem===0?0:num(g.monthly)?Math.ceil(rem/num(g.monthly)):null;let projected='積立額未設定';if(months!==null){let d=new Date();d.setMonth(d.getMonth()+months);projected=months===0?'達成済み':`${d.getFullYear()}年${d.getMonth()+1}月ごろ達成`}const deadline=g.deadline?new Date(g.deadline+'T00:00:00'):null;const now=new Date();const n=deadline?Math.max(0,(deadline.getFullYear()-now.getFullYear())*12+deadline.getMonth()-now.getMonth()):0;const needed=rem===0?0:n?Math.ceil(rem/n):null;return `<div class="rowitem"><div class="flex"><b>🎯 ${esc(g.name)}</b><span class="pill">${Math.round(pct)}%</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="flex muted"><span>${money(g.saved)} / ${money(g.price)}</span><span>${projected}</span></div><div class="muted" style="margin-top:5px">希望日 ${g.deadline?fmtDate(g.deadline):'未設定'} · 必要積立 ${needed===null?'算出不可':money(needed)+'/月'}</div><div class="actions" style="margin-top:10px">${btn('積立・取崩し',`allocateGoal('${g.id}')`)}${btn('編集',`goalForm('${g.id}')`)}${btn('削除',`removeItem('goals','${g.id}')`,'danger small')}</div></div>`}
function goalsView(){const total=db.goals.reduce((s,g)=>s+num(g.monthly),0);const free=db.accounts.reduce((s,a)=>s+balance(a)-held(a)-reservedCard(a),0)-num(db.settings.reserve);return `<section class="panel"><div class="flex"><h2>欲しいもの・目的別貯金</h2>${btn('＋ 目標追加','goalForm()','')}</div>${db.goals.map(goalRow).join('')||empty('欲しいものを登録して貯金計画を立てよう')}</section><section class="panel"><h2>自動積立提案</h2><div class="muted">月間積立可能額（設定値）</div><div class="big">${money(db.settings.monthlySaving)}</div><div class="muted">目標の積立予定合計 ${money(total)} / 月</div><div class="muted" style="margin-top:6px">現在の自由資金目安 ${money(free)}</div><div class="actions" style="margin-top:12px">${btn('積立予算を設定','openSettings()')}${btn('配分案を見る','suggestAllocation()','')}</div><p class="notice">配分案は毎月の積立予算と目標の希望日を参考に計算します。提案だけでは口座残高や貯金実績は変わりません。</p></section>`}
function analysisView(){const months=Array.from({length:6},(_,i)=>{let d=new Date(selectedMonth+'-01T00:00:00');d.setMonth(d.getMonth()-(5-i));return d.toISOString().slice(0,7)});const vals=months.map(m=>{const tx=db.transactions.filter(t=>t.date?.slice(0,7)===m);return {m,inc:sumKind(tx,'income'),exp:sumKind(tx,'expense')+sumKind(tx,'cardExpense')}});const max=Math.max(1,...vals.map(v=>v.exp));const cat={};mtx().filter(t=>['expense','cardExpense'].includes(t.kind)).forEach(t=>cat[t.category||'その他']=(cat[t.category||'その他']||0)+num(t.amount));const investCost=db.investments.reduce((s,x)=>s+num(x.cost),0),investValue=db.investments.reduce((s,x)=>s+num(x.value),0);return `<section class="panel"><h2>収支分析</h2><label class="field">基準月<input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label><h3>直近6か月の支出</h3><div class="chart">${vals.map(v=>`<div><em style="height:${Math.max(3,v.exp/max*110)}px"></em>${esc(v.m.slice(5))}月</div>`).join('')}</div><h3>今月の支出内訳</h3>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="rowitem flex"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||empty('支出データがありません')}</section><section class="panel"><h2>資産・将来予測</h2><div class="rowitem flex"><span>現在の純資産</span><b>${money(net())}</b></div><div class="rowitem flex"><span>投資損益（評価額−元本）</span><b class="${investValue-investCost>=0?'green':'red'}">${money(investValue-investCost)}</b></div>${[3,6,12].map(n=>`<div class="rowitem flex"><span>${n}か月後の単純予測</span><b>${money(net()+num(db.settings.monthlySaving)*n)}</b></div>`).join('')}<p class="notice">将来予測は現在の純資産に毎月の積立予算を加算した参考値です。投資の値動き、収支変動、将来のカード決済は含みません。</p></section>`}
function modal(title,html,onSubmit){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="flex"><h2>${title}</h2><button class="btn secondary small" onclick="closeModal()">✕</button></div><form id="editform">${html}<div class="actions"><button class="btn" type="submit">保存する</button><button type="button" class="btn secondary" onclick="closeModal()">キャンセル</button></div></form></div></div>`;document.getElementById('editform').onsubmit=e=>{e.preventDefault();onSubmit(Object.fromEntries(new FormData(e.target)));closeModal();save()}}function closeModal(){document.getElementById('modalroot').innerHTML=''}function upsert(key,data,existing){if(existing)Object.assign(db[key].find(x=>x.id===existing),data);else db[key].push({id:id(),...data})}
function accountForm(existing){const a=acct(existing)||{};modal(existing?'口座を編集':'口座を追加',field('口座名','name','text',a.name,'required')+field('初期残高（円）','opening','number',a.opening??0,'required'),v=>upsert('accounts',{name:v.name,opening:Number(v.opening)},existing))}
function cardForm(existing){if(!db.accounts.length)return alert('先に引き落とし口座を登録してください');const c=card(existing)||{};modal(existing?'カードを編集':'クレカを追加',field('カード名','name','text',c.name,'required')+select('引き落とし口座','accountId',options(db.accounts,c.accountId))+field('締め日（1〜31、31は月末扱い）','closing','number',c.closing??31,'min="1" max="31" required')+field('支払日（1〜31）','payment','number',c.payment??27,'min="1" max="31" required'),v=>upsert('cards',{name:v.name,accountId:v.accountId,closing:Number(v.closing),payment:Number(v.payment)},existing))}
function transactionForm(){if(!db.accounts.length)return alert('先に口座を登録してください');const types=[['expense','支出（口座・現金）'],['income','収入'],['cardExpense','クレカ利用'],['transfer','口座間振替']];modal('取引を登録',select('取引種類','kind',types.map(([v,l])=>`<option value="${v}">${l}</option>`))+field('日付','date','date',today(),'required')+field('内容・店舗名','title','text','','required')+field('金額（円）','amount','number','','min="1" required')+field('カテゴリ','category','text','食費')+select('口座（振替の場合は出金元）','accountId',accountOptions())+(db.cards.length?select('クレカ利用時のカード','cardId',cardOptions()):'')+select('振替先口座','toAccountId',accountOptions())+`<p class="notice">クレカ利用の場合はカードを選択してください。口座間振替は異なる2口座を指定してください。</p>`,v=>{const amount=num(v.amount);if(!amount)return alert('金額を入力してください');if(v.kind==='cardExpense'&&!db.cards.length)return alert('カードを先に登録してください');if(v.kind==='transfer'){if(v.accountId===v.toAccountId)return alert('異なる口座を選んでください');const group=id();db.transactions.push({id:id(),group,date:v.date,title:v.title,amount,kind:'transferOut',accountId:v.accountId,category:'振替'},{id:id(),group,date:v.date,title:v.title,amount,kind:'transferIn',accountId:v.toAccountId,category:'振替'})}else db.transactions.push({id:id(),kind:v.kind,date:v.date,title:v.title,amount,category:v.category,accountId:v.kind==='cardExpense'?null:v.accountId,cardId:v.kind==='cardExpense'?v.cardId:null,paid:false})})}
function goalForm(existing){if(!db.accounts.length)return alert('先に口座を登録してください');const g=db.goals.find(x=>x.id===existing)||{};modal(existing?'目標を編集':'欲しいものを追加',field('欲しいもの・目標名','name','text',g.name,'required')+field('目標金額','price','number',g.price??100000,'min="1" required')+field('毎月の積立予定','monthly','number',g.monthly??10000,'min="0"')+field('購入希望日','deadline','date',g.deadline||'')+field('商品URL（任意）','url','url',g.url||'')+select('確保する口座','accountId',options(db.accounts,g.accountId)),v=>{const oldSaved=g.saved||0;const available=balance(acct(v.accountId))-held(acct(v.accountId))+(existing&&g.accountId===v.accountId?oldSaved:0);if(oldSaved>available)return alert('移動先の口座に確保できる残高が足りません');upsert('goals',{name:v.name,price:num(v.price),monthly:num(v.monthly),deadline:v.deadline,url:v.url,accountId:v.accountId,saved:oldSaved},existing)})}
function allocateGoal(existing){const g=db.goals.find(x=>x.id===existing),a=acct(g.accountId);modal('目標貯金を調整',`<div class="muted">${esc(g.name)} · 現在 ${money(g.saved)}</div><p class="notice">${esc(a.name)} の未割当残高：${money(balance(a)-held(a))}</p>`+select('操作','operation','<option value="add">積立（確保額を増やす）</option><option value="remove">取崩し（確保額を減らす）</option>')+field('金額','amount','number',1000,'min="1" required'),v=>{const n=num(v.amount);if(v.operation==='add'){if(n>balance(a)-held(a))return alert('未割当残高を超えています');g.saved=num(g.saved)+n}else{if(n>num(g.saved))return alert('確保額を超えています');g.saved-=n}})}
function investmentForm(existing){const x=db.investments.find(x=>x.id===existing)||{};modal('投資資産',field('銘柄・名称','name','text',x.name,'required')+select('区分','type',['NISAつみたて','NISA成長','特定口座','その他'].map(s=>`<option ${s===x.type?'selected':''}>${s}</option>`).join(''))+field('取得元本','cost','number',x.cost??0)+field('現在の評価額','value','number',x.value??0),v=>upsert('investments',{name:v.name,type:v.type,cost:num(v.cost),value:num(v.value)},existing))}function debtForm(existing){const x=db.debts.find(x=>x.id===existing)||{};modal('ローン・負債',field('名称','name','text',x.name,'required')+field('残高','balance','number',x.balance??0),v=>upsert('debts',{name:v.name,balance:num(v.balance)},existing))}function budgetForm(){modal('カテゴリ予算',field('カテゴリ','name','text','食費','required')+field('月間予算','amount','number',30000,'min="0" required'),v=>db.budgets[v.name]=num(v.amount))}
function payCard(cid){const c=card(cid),items=db.transactions.filter(t=>t.kind==='cardExpense'&&t.cardId===cid&&!t.paid),due=items.reduce((s,t)=>s+num(t.amount),0);if(!due)return alert('未払いの利用はありません');if(!confirm(`${c.name} の未払い ${money(due)} を ${acct(c.accountId)?.name} から精算しますか？\n※全未払い利用を一括で精算します。`))return;items.forEach(t=>{t.paid=true;t.paidDate=today()});db.transactions.push({id:id(),date:today(),title:c.name+' 引き落とし',kind:'cardPayment',amount:due,accountId:c.accountId,category:'カード精算'});save()}
function removeItem(key,identifier){const x=db[key].find(t=>t.id===identifier);if(!x)return;if(key==='accounts'&&(db.cards.some(c=>c.accountId===identifier)||db.goals.some(g=>g.accountId===identifier)||db.transactions.some(t=>t.accountId===identifier)))return alert('この口座はカード・目標・取引に使用中です。先に関連データを整理してください');if(key==='cards'&&db.transactions.some(t=>t.cardId===identifier))return alert('このカードには利用履歴があります。削除できません');if(!confirm('このデータを削除しますか？'))return;if(key==='transactions'&&x.group)db.transactions=db.transactions.filter(t=>t.group!==x.group);else db[key]=db[key].filter(t=>t.id!==identifier);save()}
function suggestAllocation(){if(!db.goals.length)return alert('先に目標を登録してください');const budget=num(db.settings.monthlySaving);if(!budget)return alert('設定から毎月の積立可能額を登録してください');const gs=db.goals.map(g=>{const d=g.deadline?new Date(g.deadline+'T00:00:00'):null,now=new Date(),months=d?Math.max(1,(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth()):12;return {g,need:Math.ceil(Math.max(0,num(g.price)-num(g.saved))/months)}}).sort((a,b)=>a.g.deadline.localeCompare(b.g.deadline));let left=budget;const rows=gs.map(x=>{const amt=Math.min(left,x.need);left-=amt;return `<div class="rowitem flex"><span>${esc(x.g.name)}</span><b>${money(amt)}/月</b></div>`}).join('');modal('積立配分の提案',`<p class="notice">希望日が近い目標を優先し、必要月額まで配分します。期限未設定の目標は12か月を仮定。</p>${rows}<p class="notice">未配分：${money(left)}。これは計画案で、実際の貯金には反映されません。</p>`,()=>{})}
function openSettings(){modal('設定',field('生活防衛資金（自由資金から除外）','reserve','number',db.settings.reserve)+field('毎月の積立可能額（提案・予測用）','monthlySaving','number',db.settings.monthlySaving)+`<div class="actions" style="margin-bottom:14px"><button class="btn secondary small" type="button" onclick="exportData()">JSONバックアップ</button><button class="btn secondary small" type="button" onclick="document.getElementById('importfile').click()">バックアップ復元</button><input id="importfile" type="file" accept="application/json" style="display:none" onchange="importData(this)"></div><p class="notice">データはこのブラウザ内に保存されます。ブラウザのデータ消去や端末変更で失われる可能性があるため、定期的にバックアップしてください。銀行との自動同期はありません。</p>`,v=>{db.settings.reserve=num(v.reserve);db.settings.monthlySaving=num(v.monthlySaving)})}function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`moneybase-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(el){const file=el.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.accounts)||!Array.isArray(data.transactions)||!Array.isArray(data.cards)||!Array.isArray(data.goals))throw Error('invalid');if(!confirm('現在のデータをバックアップの内容で上書きしますか？'))return;db={...init(),...data};closeModal();save()}catch{alert('バックアップファイルを読み込めませんでした')}};reader.readAsText(file)}render();
</script></body></html>
